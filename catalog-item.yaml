api_version: v1alpha1
display_name: Two-tier web (multi-container)
spec:
  resources:
    - name: backend
      service_type: container
      fields:
        - path: metadata.name
          display_name: Backend name
          editable: true
          default: decl-backend
        - path: image.reference
          display_name: Image
          editable: true
          default: docker.io/library/nginx:alpine
        - path: resources.cpu.min
          editable: false
          default: 1
        - path: resources.cpu.max
          editable: false
          default: 1
        - path: resources.memory.min
          editable: false
          default: 128MB
        - path: resources.memory.max
          editable: false
          default: 256MB
    - name: frontend
      service_type: container
      requires_resources:
        - backend
      fields:
        - path: metadata.name
          display_name: Frontend name
          editable: true
          default: decl-frontend
        - path: image.reference
          display_name: Image
          editable: true
          default: docker.io/library/httpd:alpine
        - path: resources.cpu.min
          editable: false
          default: 1
        - path: resources.cpu.max
          editable: false
          default: 1
        - path: resources.memory.min
          editable: false
          default: 128MB
        - path: resources.memory.max
          editable: false
          default: 256MB
